[project]
name = "ai-job-assistant-backend"
version = "0.1.0"
description = "AI Job Assistant API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "email-validator>=2.3",
    "fastapi>=0.141",
    "httpx>=0.28",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Localized email text: Cyrillic letters are intended, not look-alikes.
"app/integrations/email/templates.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
